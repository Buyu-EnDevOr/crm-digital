<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Seguro - CRM Digital</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #0f172a; /* Fundo escuro corporativo */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #fff;
        }
        .login-box { 
            background: #1e293b; 
            padding: 40px 40px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            width: 100%;
            max-width: 350px; 
            text-align: center;
        }
        h2 { margin-top: 0; color: #38bdf8; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 30px; }
        
        .btn-google { 
            width: 100%; 
            padding: 12px; 
            background-color: #ffffff; 
            color: #0f172a; 
            border: none; 
            border-radius: 6px; 
            font-size: 16px;
            font-weight: bold; 
            cursor: pointer; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.3s;
        }
        .btn-google:hover { background-color: #e2e8f0; }
        .btn-google img { width: 20px; }
    </style>
</head>
<body>

<div class="login-box">
    <h2>CRM Digital</h2>
    <p>Acesse ou crie sua conta para gerenciar seus clientes.</p>
    
    <button id="btn-google" class="btn-google">
        <!-- Ícone do Google em SVG -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="20px">
            <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
            <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
            <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
            <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
        </svg>
        Entrar com o Google
    </button>
</div>

<!-- Importando o Firebase Auth -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    // AS SUAS CHAVES AQUI
    const firebaseConfig = {
        apiKey: "AIzaSyA6fZuQf0-GshZ_wtxJW3CRFtlvFPxfaGg",
        authDomain: "crm-digital-6b415.firebaseapp.com",
        projectId: "crm-digital-6b415",
        storageBucket: "crm-digital-6b415.firebasestorage.app",
        messagingSenderId: "686804789801",
        appId: "1:686804789801:web:26ddd8979fc38ab4864a38"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    document.getElementById('btn-google').addEventListener('click', async () => {
        try {
            // Abre a janela do Google
            const resultado = await signInWithPopup(auth, provider);
            const usuario = resultado.user;
            
            // Se der certo, redireciona para a página do CRM
            window.location.href = "index.html"; 
            
        } catch (erro) {
            console.error(erro);
            alert("Ocorreu um erro no login. Tente novamente.");
        }
    });
</script>

</body>
</html>
