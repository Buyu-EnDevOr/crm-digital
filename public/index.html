<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio Digital - Delivery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="vitrine-fundo body-sem-margem"></body>
    <!-- LOGÓTIPO CLICÁVEL NO CABEÇALHO -->
    <header class="upbar">
        <div class="flex-center">
            <button id="btn-toggle" class="btn-toggle">☰</button>
            <a href="index.html">
                <img src="logo-crm.png" alt="Logo" class="logo-bolinha" id="nav-logo" onerror="this.style.display='none'">
            </a>
        </div>
        
        <div id="area-deslogada">
            <a href="login.html" class="btn-upbar">Login</a>
            <a href="cadastro.html" class="btn-upbar">Cadastro</a>
        </div>

        <div id="area-logada" class="area-logada-container oculto">
            <div class="perfil-card">
                <img id="user-foto" src="" alt="Perfil" class="perfil-foto">
                <div class="perfil-info">
                    <span id="user-email" class="perfil-email"></span>
                    <span id="user-uid" class="perfil-uid" title="Seu ID Único no Sistema"></span>
                </div>
            </div>
            
            <a href="painel-admin.html" class="btn-upbar btn-destaque oculto" id="btn-admin">Painel Admin</a>
            
            <button id="btn-logout" class="btn-upbar btn-sair-premium">
                Sair
            </button>
        </div>
    </header>

    <div class="layout-vitrine">
        <!-- MENU LATERAL UNIFICADO -->
        <aside class="sidebar" id="menu-lateral">
            <ul class="menu-lista">
                <li class="menu-item"><a href="index.html" class="menu-link-ativo">Início</a></li>
                <li class="menu-item"><a href="sobre-nos.html" class="menu-link">Sobre nós</a></li>
                <li class="menu-item"><a href="perfil.html" class="menu-link">Meu Perfil</a></li>
            </ul>
        </aside>
    
        <main class="conteudo-principal">
            <div class="vitrine-card container-servicos">
                <div class="cabecalho-cardapio">
                    <div>
                        <h1 class="servicos-titulo">Nosso Cardápio</h1>
                        <p class="servicos-subtitulo">Deslize para ver nossas especialidades.</p>
                    </div>
                    <!-- Botão do Dark Mode -->
                    <button id="btn-tema" class="btn-tema">🌙 Escuro</button>
                </div>
                
                <div id="area-admin-produtos" class="oculto" style="text-align: right; margin-bottom: 20px;">
                    <button onclick="abrirModalProduto()" style="background: var(--cor-primaria, #E11D48); color: white; border: none; padding: 12px 24px; border-radius: 25px; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 6px rgba(225, 29, 72, 0.3);">
                        ➕ Adicionar Item ao Cardápio
                    </button>
                </div>

                <!-- ONDE O JAVASCRIPT VAI INJETAR AS PRATELEIRAS -->
                <div id="container-categorias">
                    <p style="text-align: center; width: 100%; color: var(--cor-texto-mutado, #6B7280);">Carregando cardápio delicioso...</p>
                </div>
                <!-- TELA DE VER MAIS (ESCONDIDA POR PADRÃO) -->
                <div id="tela-ver-mais" class="oculto">
                    <div class="cabecalho-ver-mais">
                        <button onclick="voltarParaVitrine()" class="btn-voltar">← Voltar</button>
                        <h2 id="titulo-ver-mais" class="titulo-categoria">Categoria</h2>
                    </div>
                    
                    <div class="barra-filtros">
                        <select id="select-ordenacao" onchange="ordenarProdutos()">
                            <option value="padrao">Relevância (Padrão)</option>
                            <option value="preco-asc">Menor Preço</option>
                            <option value="preco-desc">Maior Preço</option>
                            <option value="az">Alfabética (A-Z)</option>
                            <option value="za">Alfabética (Z-A)</option>
                        </select>
                        
                        <div class="botoes-layout">
                            <button id="btn-grid" onclick="mudarLayout('grid')" class="ativo">Grid 🔲</button>
                            <button id="btn-lista" onclick="mudarLayout('lista')">Lista ☰</button>
                        </div>
                    </div>

                    <!-- O Grid que vai receber os produtos filtrados -->
                    <div id="grid-ver-mais" class="grid-servicos">
                        <!-- O JS injeta aqui -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Overlay Global para os Modais -->
    <div id="overlay-produto" class="admin-overlay" onclick="fecharModalProduto(); fecharModalLeitura();"></div>

    <!-- Modal Admin: Criar Produto -->
    <div id="modal-produto" class="admin-modal painel">
        <h2 class="modal-titulo">Adicionar Item ao Cardápio</h2>
        
        <label>Nome do Item:</label>
        <input type="text" id="prod-nome" placeholder="Ex: Burger Clássico">

        <!-- Campo de Categoria -->
        <label>Categoria:</label>
        <select id="prod-categoria" class="modal-input" style="width: 100%; padding: 8px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #ccc; font-family: inherit;">
            <option value="Hambúrgueres">Hambúrgueres</option>
            <option value="Pizzas">Pizzas</option>
            <option value="Bebidas">Bebidas</option>
            <option value="Combos">Combos</option>
        </select>

        <label>Descrição:</label>
        <textarea id="prod-descricao" rows="3" class="modal-textarea" placeholder="Descreva os ingredientes..."></textarea>

        <label>Valor (R$):</label>
        <input type="number" id="prod-valor" placeholder="Ex: 35.90" step="0.01">

        <label>Link da Imagem:</label>
        <input type="text" id="prod-imagem" placeholder="https://...">

        <div class="modal-botoes-container">
            <button onclick="salvarProduto()" class="btn-modal-salvar">Salvar Item</button>
            <button onclick="fecharModalProduto()" class="btn-modal-cancelar">Cancelar</button>
        </div>
    </div>

    <!-- Modal Cliente: Ler Descrição Completa -->
    <div id="modal-leitura" class="modal-leitura">
        <div class="modal-leitura-cabecalho">
            <h3 class="modal-leitura-titulo" id="titulo-leitura">Detalhes</h3>
            <button class="btn-fechar-leitura" onclick="fecharModalLeitura()">×</button>
        </div>
        <div class="modal-leitura-texto" id="texto-leitura"></div>
    </div>

    <!-- CHAMA O JAVASCRIPT EXTERNO AQUI (COMO MÓDULO) -->
    <script type="module" src="script.js"></script>
</body>
</html>
