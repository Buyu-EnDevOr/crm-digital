<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrine Digital</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="tema-claro vitrine-fundo" style="margin: 0; overflow-x: hidden;"> 

    <!-- Upbar (Navegação Superior) -->
    <header class="upbar">
        <!-- Logo em formato circular (Bolinha) -->
        <img src="logo-crm.png" alt="Logo" class="logo-bolinha" id="nav-logo">
        
        <div>
            <a href="login.html" class="btn-upbar">Login</a>
            <a href="cadastro.html" class="btn-upbar">Cadastro</a>
            <a href="painel-admin.html" class="btn-upbar btn-destaque">Painel Admin</a>
        </div>
    </header>

    <!-- Layout Principal -->
    <div class="layout-vitrine">
        <!-- Sidebar -->
        <aside class="sidebar" style="background-color: rgba(226, 232, 240, 0.95);">
            <ul style="list-style: none; padding: 0;">
                <li style="margin-bottom: 15px;"><a href="#" style="text-decoration: none; color: #4a5568; font-weight: bold;">Início</a></li>
                <li style="margin-bottom: 15px;"><a href="#" style="text-decoration: none; color: #4a5568; font-weight: bold;">Serviços</a></li>
                <li style="margin-bottom: 15px;"><a href="#" style="text-decoration: none; color: #4a5568; font-weight: bold;">Sobre nós</a></li>
            </ul>
        </aside>

        <!-- Conteúdo Central -->
        <main class="conteudo-principal">
            <div style="max-width: 800px; width: 100%;">
                
                <!-- Card flutuante translúcido para o texto não sumir no fundo -->
                <div class="vitrine-card">
                    <h1 id="texto-titulo" style="color: #1a365d; font-size: 2.5rem; margin-top: 0; margin-bottom: 5px;">Carregando...</h1>
                    <h3 id="texto-subtitulo" style="color: #4a5568; margin-top: 0; margin-bottom: 30px;">...</h3>

                    <div class="vitrine-imagem-container" style="width: 100%; height: auto; aspect-ratio: 16/9;">
                        <img id="imagem-destaque" src="" alt="Destaque da Vitrine" style="width: 100%; height: 100%; object-fit: cover; border-radius: 8px;">
                    </div>

                    <div style="margin-top: 30px; border-left: 4px solid #2b6cb0; padding-left: 15px;">
                        <p id="texto-descricao" style="font-size: 1.1rem; line-height: 1.6; color: #2d3748; white-space: pre-line; margin-top: 0;"></p>
                        <p style="font-weight: bold; margin-top: 20px; color: #2b6cb0;">Contato: <span id="texto-contato"></span></p>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Engrenagem Invisível -->
    <div class="area-admin-gear">
        <div class="gear-icon" onclick="abrirConfigAdmin()">⚙️</div>
    </div>

    <!-- Fundo Escuro do Modal -->
    <div id="overlay-admin" class="admin-overlay" onclick="fecharConfigAdmin()"></div>

    <!-- Modal Admin -->
    <div id="modal-admin" class="admin-modal painel">
        <h2 style="margin-bottom: 20px;">Central de Edição (Vitrine)</h2>
        
        <label>Título:</label>
        <input type="text" id="edit-titulo">

        <label>Subtítulo:</label>
        <input type="text" id="edit-subtitulo">

        <label>Link da Imagem (Cloudinary/URL):</label>
        <input type="text" id="edit-imagem">

        <label>Descrição:</label>
        <textarea id="edit-descricao" rows="4" style="width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; font-family: inherit; resize: vertical;"></textarea>

        <label>Contato / WhatsApp:</label>
        <input type="text" id="edit-contato">

        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button onclick="salvarConfigAdmin()" style="margin-top: 0; flex: 1;">Salvar Alterações</button>
            <button onclick="fecharConfigAdmin()" style="margin-top: 0; flex: 1; background-color: #f56565;">Cancelar</button>
        </div>
    </div>

    <script>
        async function carregarVitrine() {
            try {
                const resposta = await fetch('/api/config');
                const dados = await resposta.json();

                document.getElementById('texto-titulo').innerText = dados.titulo;
                document.getElementById('texto-subtitulo').innerText = dados.subtitulo;
                document.getElementById('imagem-destaque').src = dados.imagem_url;
                document.getElementById('texto-descricao').innerText = dados.descricao;
                document.getElementById('texto-contato').innerText = dados.contato;
                
                document.getElementById('edit-titulo').value = dados.titulo;
                document.getElementById('edit-subtitulo').value = dados.subtitulo;
                document.getElementById('edit-imagem').value = dados.imagem_url;
                document.getElementById('edit-descricao').value = dados.descricao;
                document.getElementById('edit-contato').value = dados.contato;
            } catch (erro) {
                console.error("Erro ao carregar a vitrine:", erro);
            }
        }

        function abrirConfigAdmin() {
            document.getElementById('overlay-admin').style.display = 'block';
            document.getElementById('modal-admin').style.display = 'block';
        }

        function fecharConfigAdmin() {
            document.getElementById('overlay-admin').style.display = 'none';
            document.getElementById('modal-admin').style.display = 'none';
        }

        async function salvarConfigAdmin() {
            const novosDados = {
                titulo: document.getElementById('edit-titulo').value,
                subtitulo: document.getElementById('edit-subtitulo').value,
                imagem_url: document.getElementById('edit-imagem').value,
                descricao: document.getElementById('edit-descricao').value,
                contato: document.getElementById('edit-contato').value
            };

            try {
                const resposta = await fetch('/api/config', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(novosDados)
                });

                if (resposta.ok) {
                    alert("Vitrine atualizada com sucesso!");
                    fecharConfigAdmin();
                    carregarVitrine(); 
                } else {
                    alert("Erro ao salvar configurações.");
                }
            } catch (erro) {
                console.error("Erro ao salvar:", erro);
                alert("Erro de conexão com o servidor.");
            }
        }

        carregarVitrine();
    </script>
</body>
</html>
