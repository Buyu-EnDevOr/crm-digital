<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel CRM - Gestão de Clientes</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #eef2f5; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .painel { 
            background: #ffffff; 
            padding: 30px 40px; 
            border-radius: 10px; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.1); 
            width: 100%;
            max-width: 400px; 
        }
        h2 { 
            color: #1a365d; 
            margin-top: 0; 
            text-align: center;
            margin-bottom: 25px;
        }
        label { 
            display: block; 
            margin-top: 15px; 
            color: #4a5568; 
            font-size: 14px;
            font-weight: bold; 
        }
        input, select { 
            width: 100%; 
            padding: 10px; 
            margin-top: 5px; 
            border: 1px solid #cbd5e0; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 15px;
        }
        button { 
            width: 100%; 
            padding: 12px; 
            background-color: #2b6cb0; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            margin-top: 25px; 
            font-size: 16px;
            font-weight: bold; 
            cursor: pointer; 
            transition: background 0.3s;
        }
        button:hover { 
            background-color: #2c5282; 
        }
    </style>
</head>
<body>

<div class="painel">
    <h2>Cadastro de Novo Lead</h2>
    
    <form id="crm-form">
        <label for="nome">Nome do Cliente:</label>
        <input type="text" id="nome" name="nome" placeholder="Ex: João Silva" required>

        <label for="telefone">Telefone / WhatsApp:</label>
        <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>

        <label for="polo">Polo de Atendimento:</label>
        <select id="polo" name="polo">
            <option value="lagoa_dourada">Lagoa Dourada</option>
            <option value="juiz_de_fora">Juiz de Fora</option>
            <option value="digital">Atendimento Digital</option>
        </select>

        <label for="status">Status da Negociação:</label>
        <select id="status" name="status">
            <option value="prospeccao">Em Prospecção</option>
            <option value="negociacao">Em Negociação</option>
            <option value="fechado">Venda Fechada</option>
        </select>

        <button type="button" id="btn-salvar">Salvar Cliente</button>
    </form>
</div>

<!-- Importando o Firebase (Módulo) -->
<script type="module">
    // 1. Puxando as ferramentas do Firebase direto da nuvem
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
// --- ADICIONE ISTO: O SEGURANÇA DA PORTA ---
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    const auth = getAuth(app);

    // Fica vigiando para ver se a pessoa tem a "pulseira VIP" do Google
    onAuthStateChanged(auth, (user) => {
        if (!user) {
            // Se não tem usuário logado, expulsa de volta pro login
            window.location.href = "login.html";
        } else {
            // Se estiver logado, exibe um log no console (opcional)
            console.log("Usuário logado:", user.displayName);
        }
    });
    // -------------------------------------------
    // 2. As suas chaves de acesso
    const firebaseConfig = {
        apiKey: "AIzaSyA6fZuQf0-GshZ_wtxJW3CRFtlvFPxfaGg",
        authDomain: "crm-digital-6b415.firebaseapp.com",
        projectId: "crm-digital-6b415",
        storageBucket: "crm-digital-6b415.firebasestorage.app",
        messagingSenderId: "686804789801",
        appId: "1:686804789801:web:26ddd8979fc38ab4864a38"
    };

    // 3. Inicializando o sistema
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 4. Lógica de clique no botão
    document.getElementById('btn-salvar').addEventListener('click', async () => {
        // Pegando os valores que você digitou na tela
        const nomeValor = document.getElementById('nome').value;
        const telefoneValor = document.getElementById('telefone').value;
        const poloValor = document.getElementById('polo').value;
        const statusValor = document.getElementById('status').value;
        const botao = document.getElementById('btn-salvar');

        // Validação simples para não salvar vazio
        if(nomeValor === "" || telefoneValor === "") {
            alert("Por favor, preencha o Nome e o Telefone!");
            return;
        }

        botao.innerText = "Salvando...";
        botao.style.backgroundColor = "#718096";

        try {
            // Mandando os dados para uma "pasta" chamada 'leads' no banco de dados
            await addDoc(collection(db, "leads"), {
                nome: nomeValor,
                telefone: telefoneValor,
                polo: poloValor,
                status: statusValor,
                dataCadastro: new Date().toISOString()
            });

            alert("Cliente salvo com sucesso no banco de dados!");
            
            // Limpa o formulário e volta o botão ao normal
            document.getElementById('crm-form').reset();
            botao.innerText = "Salvar Cliente";
            botao.style.backgroundColor = "#2b6cb0";

        } catch (erro) {
            console.error("Erro ao salvar: ", erro);
            alert("Erro ao conectar com o banco de dados.");
            botao.innerText = "Salvar Cliente";
            botao.style.backgroundColor = "#2b6cb0";
        }
    });
</script>

</body>
</html>
