<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel CRM - Gestão de Clientes</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #eef2f5; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .painel { 
            background: #ffffff; 
            padding: 30px 40px; 
            border-radius: 10px; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.1); 
            width: 100%;
            max-width: 400px; 
        }
        h2 { 
            color: #1a365d; 
            margin-top: 0; 
            text-align: center;
            margin-bottom: 25px;
        }
        label { 
            display: block; 
            margin-top: 15px; 
            color: #4a5568; 
            font-size: 14px;
            font-weight: bold; 
        }
        input, select { 
            width: 100%; 
            padding: 10px; 
            margin-top: 5px; 
            border: 1px solid #cbd5e0; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 15px;
        }
        button { 
            width: 100%; 
            padding: 12px; 
            background-color: #2b6cb0; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            margin-top: 25px; 
            font-size: 16px;
            font-weight: bold; 
            cursor: pointer; 
            transition: background 0.3s;
        }
        button:hover { 
            background-color: #2c5282; 
        }
    </style>
</head>
<body>

<div class="painel">
    <h2>Cadastro de Novo Lead</h2>
    
    <!-- Este formulário ainda não faz nada, é apenas a interface -->
    <form id="crm-form">
        <label for="nome">Nome do Cliente:</label>
        <input type="text" id="nome" name="nome" placeholder="Ex: João Silva" required>

        <label for="telefone">Telefone / WhatsApp:</label>
        <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>

        <label for="polo">Polo de Atendimento:</label>
        <select id="polo" name="polo">
            <option value="lagoa_dourada">Lagoa Dourada</option>
            <option value="juiz_de_fora">Juiz de Fora</option>
            <option value="digital">Atendimento Digital</option>
        </select>

        <label for="status">Status da Negociação:</label>
        <select id="status" name="status">
            <option value="prospeccao">Em Prospecção</option>
            <option value="negociacao">Em Negociação</option>
            <option value="fechado">Venda Fechada</option>
        </select>

        <button type="button" onclick="alert('O Python ainda vai assumir este botão!')">Salvar Cliente</button>
    </form>
</div>

</body>
</html>
